name: ci
run-name: ci (${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'github-hosted' }})

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner pool (self-hosted requires an online covington-linux runner)
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - self-hosted

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "Linux", "X64", "covington-linux"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 45
    env:
      APKPROJECT_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned toolchain (D8, Z3, JADX, ECJ, android.jar, REA + Wakaru)
        run: scripts/setup-toolchain.sh --full
      - name: Unit and integration tests (includes end-to-end decompile with verified repair)
        run: ./gradlew --no-daemon test
      - name: Source restoration provenance checks
        run: |
          python3 -m pip install cryptography==50.0.0
          python3 -m pip install -r scripts/ml/requirements.txt
          python3 -m unittest discover -s scripts/tests -v
      - name: Independent backend schema and HTTP checks
        run: |
          python3 -m pip install PyYAML==6.0.2 openapi-spec-validator==0.7.1
          python3 benchmarks/backend-contract/check_mock.py modules/app-recovery/build/contract-assurance
      - name: Validate the product's own JVM inventory and packaged hashes
        run: |
          ./gradlew --no-daemon :desktop:productSbom
          python3 scripts/check-product-sbom.py modules/desktop/build/product-sbom.cdx.json modules/desktop/build/install/apkproject-studio/lib
      - name: Toolchain doctor
        run: |
          ./gradlew --no-daemon :cli:installDist
          modules/cli/build/install/apkproject/bin/apkproject doctor
          modules/cli/build/install/apkproject/bin/apkproject doctor --profile profiles/android-full.json
      - name: Fixture benchmark (independent execution, seeded wrong candidates)
        run: ./gradlew --no-daemon :benchmarks:run
      - name: Library names against R8 ground truth (two workloads, four optimization settings)
        run: benchmarks/library-matching/run.sh --suite
      - name: Pinned Tusky source accuracy and live HTTP regression gates
        run: |
          mkdir -p runs/tusky-truth
          curl --fail --location --retry 3 --max-time 180 -o runs/tusky-142.apk https://f-droid.org/repo/com.keylesspalace.tusky_142.apk
          git -C runs/tusky-truth init
          git -C runs/tusky-truth remote add origin https://github.com/tuskyapp/Tusky.git
          git -C runs/tusky-truth fetch --depth=1 origin ff0c9f58874fafc72a53789f079ce0dc1a7e9207
          git -C runs/tusky-truth checkout --detach FETCH_HEAD
          modules/cli/build/install/apkproject/bin/apkproject contract runs/tusky-142.apk --out runs/tusky-api
          python3 benchmarks/backend-contract/evaluate.py runs/tusky-truth runs/tusky-api/api-contract.json --apk runs/tusky-142.apk --baseline benchmarks/backend-contract/tusky-baseline.json --metrics-out runs/tusky-api/source-metrics.json
          python3 benchmarks/backend-contract/check_mock.py runs/tusky-api
          modules/cli/build/install/apkproject/bin/apkproject contract runs/tusky-142.apk --out runs/tusky-reference-api --reference-types benchmarks/backend-contract/tusky-reference-types.json --reference-source runs/tusky-truth
          python3 benchmarks/backend-contract/check_reference_types.py runs/tusky-truth runs/tusky-reference-api/api-contract.json --raw-contract runs/tusky-api/api-contract.json --manifest benchmarks/backend-contract/tusky-reference-types.json --apk runs/tusky-142.apk
          python3 benchmarks/backend-contract/evaluate.py runs/tusky-truth runs/tusky-reference-api/api-contract.json --apk runs/tusky-142.apk --baseline benchmarks/backend-contract/tusky-baseline.json --metrics-out runs/tusky-reference-api/source-metrics.json
          python3 benchmarks/backend-contract/check_mock.py runs/tusky-reference-api
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.runner != 'self-hosted') }}
        with:
          name: benchmark-results
          path: |
            benchmarks/results/
            benchmarks/library-matching/eval.txt
            benchmarks/library-matching/suite.json
            benchmarks/library-matching/reports/
            modules/*/build/reports/tests/
            modules/app-recovery/build/contract-assurance/
            runs/tusky-api/
            runs/tusky-reference-api/
