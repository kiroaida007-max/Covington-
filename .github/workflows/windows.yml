name: windows

# The desktop app and the toolchain on a real Windows machine: the pinned tools installed by
# `apkproject setup`, a demo app recovered and every screen photographed with the native
# Windows look, and the app packaged with its own Java runtime.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      APKPROJECT_TOOLS: ${{ github.workspace }}\.tools
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the command line and the desktop app
        run: ./gradlew.bat --no-daemon :cli:installDist :desktop:installDist
      - name: Install the pinned tools (apkproject setup)
        run: modules/cli/build/install/apkproject/bin/apkproject.bat setup --tools "$env:APKPROJECT_TOOLS"
      - name: Toolchain doctor with the Windows profile
        run: modules/cli/build/install/apkproject/bin/apkproject.bat doctor --profile profiles/android-windows.json
      - name: Desktop, installer and profile tests
        run: ./gradlew.bat --no-daemon :desktop:test :contracts:test :orchestrator:test --tests "*ToolchainInstaller*"
      - name: Recover a demo app and photograph every screen
        run: ./gradlew.bat --no-daemon :desktop:screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: modules/desktop/build/screenshots/
          if-no-files-found: error
      - name: Portable app (folder with APK Project Studio.exe and its own Java runtime)
        run: |
          ./gradlew.bat --no-daemon :desktop:packageApp -Ptype=app-image
          Compress-Archive -Path "modules/desktop/build/jpackage/APK Project Studio" -DestinationPath modules/desktop/build/APK-Project-Studio-portable.zip
      - name: Installer (.exe; jpackage needs WiX 3)
        continue-on-error: true
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" | Select-Object -First 1
            $env:PATH = "$($wix.FullName);$env:PATH"
          }
          ./gradlew.bat --no-daemon :desktop:packageApp -Ptype=exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-app
          path: |
            modules/desktop/build/APK-Project-Studio-portable.zip
            modules/desktop/build/jpackage/*.exe
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-reports
          path: modules/*/build/reports/tests/
          if-no-files-found: ignore
