name: Windows desktop

on:
  pull_request:
  push:
    branches: [codex/windows-desktop-gui, ccr-b00e80ab-1evg7q, main]
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      APKPROJECT_TOOLS: ${{ github.workspace }}\.tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build desktop and CLI
        run: |
          ./gradlew.bat --no-daemon :desktop:installDist :cli:installDist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Windows toolchain
        run: |
          & modules/cli/build/install/apkproject/bin/apkproject.bat setup --tools "$env:APKPROJECT_TOOLS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & modules/cli/build/install/apkproject/bin/apkproject.bat doctor --profile profiles/android-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows unit and integration tests
        run: |
          ./gradlew.bat --no-daemon test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Core integration checks must run with the installed Windows tools, not skip on Linux paths.
          $suites = @{
            'compiler-runner/TEST-dev.apkproject.compiler.WorkersTest.xml' = 2 # two POSIX shell checks
            'validate/TEST-dev.apkproject.validate.ValidateTest.xml' = 0
            'orchestrator/TEST-dev.apkproject.orchestrator.RecoveryJobTest.xml' = 0
            'app-recovery/TEST-dev.apkproject.app.FullRecoveryIntegrationTest.xml' = 0
            'app-recovery/TEST-dev.apkproject.app.FullJobFailureTest.xml' = 0
            'compiler-runner/TEST-dev.apkproject.compiler.ProcessFailureTest.xml' = 0
            'archive/TEST-dev.apkproject.archive.FileArchiveTest.xml' = 0
            'app-recovery/TEST-dev.apkproject.app.MethodNamingIntegrationTest.xml' = 0
            'app-recovery/TEST-dev.apkproject.app.ContractAccuracyTest.xml' = 0
            'app-recovery/TEST-dev.apkproject.app.ContractAssuranceTest.xml' = 0
            'app-recovery/TEST-dev.apkproject.app.EmbeddedBackendTest.xml' = 0
          }
          foreach ($key in $suites.Keys) {
            $module, $file = $key.Split('/', 2)
            [xml]$report = Get-Content "modules/$module/build/test-results/test/$file"
            if ([int]$report.testsuite.skipped -ne $suites[$key]) { throw "Unexpected skipped tests in $key" }
          }
      - name: Recover real D8 fixture on Windows
        run: |
          & modules/cli/build/install/apkproject/bin/apkproject.bat decompile modules/formats-dex/src/test/resources/d8/broad.dex --out runs/windows-desktop --profile profiles/android-windows.json --no-rea --no-js --no-repair --no-library-names --threads 2
          if ($LASTEXITCODE -notin @(0, 4)) { exit $LASTEXITCODE }
          if (!(Test-Path runs/windows-desktop/recovery/report.json)) { throw 'Recovery did not produce a report' }
      - name: Package self-contained Windows app
        run: |
          ./gradlew.bat --no-daemon :desktop:packageApp -Ptype=app-image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = 'modules/desktop/build/jpackage/APK Project Studio'
          & "$app/runtime/bin/javac.exe" -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled javac is not usable' }
          New-Item -ItemType Directory -Force runs/compiler-probe | Out-Null
          'class CompilerProbe { public static void main(String[] args) { System.out.print("compiler works"); } }' | Set-Content runs/compiler-probe/CompilerProbe.java
          & "$app/runtime/bin/javac.exe" runs/compiler-probe/CompilerProbe.java
          if ($LASTEXITCODE -ne 0) { throw 'Bundled javac failed compilation' }
          $answer = & "$app/runtime/bin/java.exe" -cp runs/compiler-probe CompilerProbe
          if ($LASTEXITCODE -ne 0 -or $answer -ne 'compiler works') { throw 'Bundled runtime failed execution' }
          & "$app/runtime/bin/java.exe" -cp 'modules/cli/build/install/apkproject/lib/*' dev.apkproject.cli.MainKt doctor --profile profiles/android-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Bundled runtime failed toolchain smoke checks' }
          Compress-Archive -Path $app -DestinationPath modules/desktop/build/jpackage/APK-Project-Studio-windows.zip
      - name: Capture native Windows screens and exercise UI
        run: |
          $app = Resolve-Path 'modules/desktop/build/jpackage/APK Project Studio/APK Project Studio.exe'
          $project = (Resolve-Path runs/windows-desktop).Path
          $output = "$env:GITHUB_WORKSPACE/runs/windows-screenshots"
          $inputFile = (Resolve-Path modules/formats-dex/src/test/resources/d8/broad.dex).Path
          $process = Start-Process -FilePath $app -ArgumentList @('--capture', "`"$project`"", "`"$output`"", "`"$inputFile`"") -PassThru
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw 'Desktop capture timed out' }
          if ($process.ExitCode -ne 0) { throw "Desktop capture failed: $($process.ExitCode)" }
          if ((Get-ChildItem "$output/*.png").Count -ne 16) { throw 'Expected sixteen screenshots' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-screenshots
          path: runs/windows-screenshots/
      - name: Locate WiX 3 for JDK 17 jpackage
        run: |
          $wix = Get-ChildItem 'C:/Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1
          if (!$wix) { choco install wixtoolset --version=3.14.1 --no-progress -y; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $wix = Get-ChildItem 'C:/Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1 }
          if (!$wix) { throw 'WiX 3 not found' }
          "$($wix.FullName)/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build EXE and MSI installers
        run: |
          ./gradlew.bat --no-daemon :desktop:packageApp -Ptype=exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gradlew.bat --no-daemon :desktop:packageApp -Ptype=msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-packages
          path: |
            modules/desktop/build/jpackage/*.exe
            modules/desktop/build/jpackage/*.msi
            modules/desktop/build/jpackage/*.zip
            modules/*/build/reports/tests/
            runs/windows-desktop/recovery/
